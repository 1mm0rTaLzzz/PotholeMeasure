# Pothole depth/area pipeline — default configuration.

paths:
  data_root: data/raw
  annotations: data/annotations
  calibration: data/calibration/camera.yaml
  checkpoints: experiments/checkpoints
  outputs: experiments/results

image:
  target_width: 1280
  target_height: 720

segmentation:
  # Generic COCO-pretrained backbone used as a fallback / fine-tuning starting point.
  model: yolov8m-seg.pt
  # Best-trained pothole checkpoint. To skip training entirely, point this at a
  # pothole-pretrained .pt — e.g. `python scripts/download_pretrained.py
  # --hf-repo keremberke/yolov8s-pothole-segmentation`
  # which writes experiments/checkpoints/seg/keremberke_yolov8s.pt.
  finetuned_weights: experiments/checkpoints/seg/best.pt
  conf_threshold: 0.50           # filters most low-confidence FPs (manholes, patches)
  iou_threshold: 0.5
  classes: [pothole]
  train:
    # Fine-tuning from a pothole-pretrained checkpoint converges in ~20 epochs;
    # bump to 100 only when training from COCO weights.
    epochs: 30
    batch_size: 16
    imgsz: 1280
    lr0: 0.001
    device: 0

depth:
  model_id: depth-anything/Depth-Anything-V2-Metric-Outdoor-Large-hf
  device: cuda
  # Clip range in meters for sanity (outdoor road scenes).
  min_depth_m: 0.5
  max_depth_m: 80.0

plane_fitting:
  ransac_threshold_m: 0.02      # 2 cm inlier distance.
  max_iterations: 1000
  min_inlier_ratio: 0.7
  min_points: 1000
  # Camera up axis in its own frame; normal of road plane must be close to this.
  up_axis: [0.0, -1.0, 0.0]
  up_cos_threshold: 0.9
  offset_percentile: 95         # Reported depth = p95 of |offset| inside mask.

homography:
  # Placeholder — recomputed per-image if lane detection enabled.
  method: calibration            # one of: calibration, lanes
  lane_width_m: 3.5

# Post-segmentation sanity filter. Drops detections that are clearly NOT
# on the road (above the horizon, too far from the fitted plane, or that
# project to absurd areas via the homography). With a domain-shifted
# pretrained model these would otherwise produce rubbish like
# `area_m2 = 17000000` on a tree above the road.
road_filter:
  max_area_m2: 5.0               # absolute upper bound on a single pothole
  max_offset_to_plane_m: 0.30    # detection median |dist to plane|
  min_centroid_y_frac: 0.40      # mask centroid must be in lower 60% of the image
  min_inlier_ratio_for_geom: 0.60

# Severity thresholds — aligned with GOST R 50597-2017.
# A pothole is classified at the highest severity whose depth_m OR area_m2 is exceeded.
severity:
  # Which signal drives the bucketing:
  #   max         worst of (depth bucket, area bucket) — full GOST rule.
  #   area_only   only area is used — recommended when monocular depth is
  #               unreliable on your dataset (e.g. RDD2022 dashcam crops).
  #   depth_only  only depth is used.
  signal: area_only
  thresholds:
    - name: minor
      max_depth_m: 0.02
      max_area_m2: 0.05
    - name: moderate
      max_depth_m: 0.05
      max_area_m2: 0.25
    - name: major
      max_depth_m: 0.10
      max_area_m2: 1.00
    - name: critical
      max_depth_m: .inf
      max_area_m2: .inf

visualization:
  colors:
    minor:    [0, 255, 0]
    moderate: [0, 255, 255]
    major:    [0, 128, 255]
    critical: [0, 0, 255]
  alpha: 0.5
  dpi: 300
